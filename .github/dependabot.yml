version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Held at 6.x until typescript-eslint supports 7.x.
      - dependency-name: typescript
        versions: ['>=7']
      # Crypto dependency: upgrades are reviewed by hand. See docs/ARCHITECTURE.md section 3.
      - dependency-name: hash-wasm
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
