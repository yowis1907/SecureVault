name: CI

on:
  push:
    branches: [main]
  pull_request:

# Workflows get read-only access unless a job asks for more.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA so a moved tag cannot change what runs.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, format check, unit and integration tests
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high

  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Start the stack and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:3000/
          grep -i '^content-security-policy:' headers.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/anything)
          # Anonymous requests to the API are refused as unauthenticated.
          test "$code" = "401"
          # /actuator is private. nginx should answer with the app shell, not health JSON.
          if curl -s http://127.0.0.1:3000/actuator/health | grep -q '"status"'; then
            echo "Actuator is exposed through nginx" >&2
            exit 1
          fi
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack and wait until healthy
        run: docker compose --env-file .env.example up -d --build --wait --wait-timeout 300
      - name: Install test dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Journey, canary scans, and locking tests
        working-directory: e2e
        run: npx playwright test
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example down -v

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull request, gitleaks reads the list of its commits.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
