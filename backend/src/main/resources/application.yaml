# Connection settings come from the standard SPRING_DATASOURCE_URL, _USERNAME
# and _PASSWORD environment variables, so no credentials live in this file.
spring:
  application:
    name: securevault
  jpa:
    hibernate:
      # Only Flyway may change the schema. Hibernate just checks that it matches.
      ddl-auto: validate
    # Database work must finish inside the service layer, not during JSON rendering.
    open-in-view: false
  session:
    jdbc:
      # Flyway owns the session tables too (V6).
      initialize-schema: never
  mail:
    # Mailpit locally and in Docker Compose. A real deployment sets SPRING_MAIL_* for its SMTP server.
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      # A request with an unexpected field is rejected, so plaintext cannot be added by accident.
      fail-on-unknown-properties: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: native
  shutdown: graceful
  servlet:
    session:
      # Idle timeout. The 8-hour absolute limit is enforced by AbsoluteSessionTimeoutFilter.
      timeout: 30m

securevault:
  # Used for links in emails. Never taken from the request's Host header.
  public-url: http://localhost:3000
  mail-from: SecureVault <no-reply@securevault.local>
  mfa:
    # 32 random bytes, base64, that encrypt TOTP secrets at rest. From the environment only: no
    # default here. Without it, outside prod, a temporary key is used (see MfaSecretCipher).
    key: ${SECUREVAULT_MFA_KEY:}
  security:
    # The cookie is HttpOnly, SameSite=Strict, Path=/ (see SecurityConfig). Local HTTP cannot use
    # Secure or the __Host- prefix; the prod profile sets both and checks them at startup.
    session-cookie-name: SV_SESSION
    session-cookie-secure: false
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
    absolute-session-timeout: 8h
    anonymous-session-timeout: 10m
    max-concurrent-password-hashes: 4

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Email failing must not mark the API unhealthy: everything except sending mail still works.
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
