server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Matches the largest API request, the batch import.
    client_max_body_size 8m;

    # nginx drops these if a location block adds its own add_header, so locations
    # below use "expires" for caching and never add_header.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Only /api/ reaches the backend. /actuator stays private to the Docker network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Overwritten rather than appended, so a client cannot spoof its own IP for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dropped, so a client cannot influence what the API believes its host or port is.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        # Spring sends this too. The server-level header above is the one that stays.
        proxy_hide_header X-Content-Type-Options;
    }

    # Build output has content-hashed names, so it can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
